replicaCount: 2
image:
  repository: mock-payment-api
  tag: local
  pullPolicy: IfNotPresent
# Example: [{name: gitlab-registry}] if your image registry requires authentication.
imagePullSecrets: []
service:
  port: 80
  targetPort: 8080
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 150m
    memory: 128Mi
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
